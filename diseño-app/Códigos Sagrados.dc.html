<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
</helmet>
<div style="{{ containerStyle }}">
<div style="{{ rootStyle }}">
  <div style="{{ textureStyle }}"></div>
  <div style="{{ glowStyle }}"></div>
  <div style="{{ frameStyle }}"></div>
  <div style="{{ frame2Style }}"></div>

  <div style="{{ artStyle }}">
    <sc-if value="{{ isAce }}" hint-placeholder-val="{{ true }}">
      <div style="{{ haloStyle }}"></div>
      <img src="{{ emblemUri }}" style="{{ centerStyle }}" />
    </sc-if>
    <sc-if value="{{ isPip }}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{ pips }}" as="p" hint-placeholder-count="3">
        <img src="{{ p.uri }}" style="{{ p.style }}" />
      </sc-for>
    </sc-if>
    <sc-if value="{{ isCourt }}" hint-placeholder-val="{{ false }}">
      <img src="{{ crownUri }}" style="{{ crownStyle }}" />
      <img src="{{ emblemUri }}" style="{{ centerStyle }}" />
      <div style="{{ nameStyle }}">{{ nameText }}</div>
    </sc-if>
  </div>

  <sc-if value="{{ showIndex }}" hint-placeholder-val="{{ true }}">
    <div style="{{ idxTLStyle }}"><div style="{{ idxNumStyle }}">{{ idxText }}</div><img src="{{ emblemUri }}" style="{{ idxEmblemStyle }}" /></div>
    <div style="{{ idxBRStyle }}"><div style="{{ idxNumStyle }}">{{ idxText }}</div><img src="{{ emblemUri }}" style="{{ idxEmblemStyle }}" /></div>
  </sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;220px&quot;,&quot;height&quot;:&quot;313px&quot;}}">
class Component extends DCLogic {
  hexA(hex, a) {
    const h = (hex || '#000000').replace('#', '');
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  renderVals() {
    const p = this.props;
    const num = Number(p.num);
    const main = p.colorMain || '#ecc874';
    const gold = '#e7cf9b';
    const isAce = num === 1;
    const isCourt = num >= 10;
    const isPip = !isAce && !isCourt;
    const emblemUri = p.emblemUri || '';
    const idxColor = p.idxColor || gold;
    const bg = p.bg || 'radial-gradient(125% 95% at 50% -5%, #2a1f57 0%, #160e36 48%, #0b0726 100%)';
    const tex = p.texture !== false;

    const containerStyle = {position:'relative',width:'100%',height:'100%',containerType:'size',aspectRatio:'5 / 7'};
    const rootStyle = {position:'absolute',inset:0,borderRadius:'5cqw',overflow:'hidden',background:bg,boxShadow:'0 10px 28px rgba(0,0,0,.45)'};
    const textureStyle = tex ? {position:'absolute',inset:0,pointerEvents:'none',opacity:.5,
      backgroundImage:'radial-gradient(1px 1px at 20% 14%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 76% 22%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 38% 60%,rgba(231,207,155,.6),transparent),radial-gradient(1px 1px at 84% 76%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 14% 84%,rgba(205,189,242,.6),transparent),radial-gradient(1px 1px at 60% 40%,rgba(255,255,255,.5),transparent)'} : {display:'none'};
    const glowStyle = {position:'absolute',left:'50%',top:'50%',width:'72cqw',height:'72cqw',transform:'translate(-50%,-50%)',borderRadius:'50%',background:`radial-gradient(circle, ${this.hexA(main,.22)}, transparent 70%)`,pointerEvents:'none'};
    const frameStyle = {position:'absolute',inset:'3.5cqw',border:'1.1cqw solid '+gold,borderRadius:'4cqw',boxShadow:'inset 0 0 7cqw rgba(0,0,0,.45)',pointerEvents:'none'};
    const frame2Style = {position:'absolute',inset:'6cqw',border:'0.4cqw solid '+this.hexA(gold,.45),borderRadius:'3cqw',pointerEvents:'none'};
    const artStyle = {position:'absolute',top:'15cqw',bottom:'15cqw',left:'11cqw',right:'11cqw'};

    const layouts = {
      2:[[50,20],[50,80]], 3:[[50,15],[50,50],[50,85]],
      4:[[30,22],[70,22],[30,78],[70,78]],
      5:[[28,20],[72,20],[50,50],[28,80],[72,80]],
      6:[[30,16],[70,16],[30,50],[70,50],[30,84],[70,84]],
      7:[[30,15],[70,15],[30,46],[70,46],[30,84],[70,84],[50,32]],
      8:[[30,13],[70,13],[30,37],[70,37],[30,63],[70,63],[30,87],[70,87]],
      9:[[30,13],[70,13],[30,35],[70,35],[30,65],[70,65],[30,87],[70,87],[50,50]]
    };
    const sizeByN = {2:25,3:21,4:20,5:18,6:16,7:15,8:14,9:13};
    let pips = [];
    if (isPip) {
      const pts = layouts[num] || []; const sz = sizeByN[num] || 18;
      pips = pts.map((pt,i) => {
        const big = (num===5 && i===2) || (num===7 && i===6);
        const s = big ? sz+3 : sz;
        const rot = pt[1] > 50 ? 180 : 0;
        return {uri:emblemUri, style:{position:'absolute',left:pt[0]+'%',top:pt[1]+'%',width:s+'cqw',height:'auto',transform:`translate(-50%,-50%) rotate(${rot}deg)`}};
      });
    }
    const haloStyle = {position:'absolute',left:'50%',top:'50%',width:'56cqw',height:'56cqw',transform:'translate(-50%,-50%)',borderRadius:'50%',border:'0.5cqw solid '+this.hexA(gold,.5),boxShadow:'0 0 9cqw '+this.hexA(main,.35)};
    const centerStyle = isAce
      ? {position:'absolute',left:'50%',top:'50%',width:'40cqw',height:'auto',transform:'translate(-50%,-50%)'}
      : {position:'absolute',left:'50%',top:'56%',width:'44cqw',height:'auto',transform:'translate(-50%,-50%)'};
    const crownStyle = {position:'absolute',left:'50%',top:'0cqw',width:'34cqw',height:'auto',transform:'translateX(-50%)'};
    const nameStyle = {position:'absolute',left:0,right:0,bottom:'-1cqw',textAlign:'center',fontFamily:"'Cormorant Garamond',serif",fontWeight:600,fontSize:'8.5cqw',letterSpacing:'.6cqw',color:gold,textTransform:'uppercase'};

    const idxNumStyle = {fontFamily:"'Cormorant Garamond',serif",fontWeight:700,fontSize:'12.5cqw',lineHeight:1,color:idxColor};
    const idxEmblemStyle = {width:'8.5cqw',height:'auto',display:'block',marginTop:'1.2cqw'};
    const idxTLStyle = {position:'absolute',top:'5.5cqw',left:'6.5cqw',display:'flex',flexDirection:'column',alignItems:'center'};
    const idxBRStyle = {position:'absolute',bottom:'5.5cqw',right:'6.5cqw',display:'flex',flexDirection:'column',alignItems:'center',transform:'rotate(180deg)'};

    return {containerStyle,rootStyle,textureStyle,glowStyle,frameStyle,frame2Style,artStyle,
      isAce,isCourt,isPip,pips,emblemUri,crownUri:p.crownUri||'',haloStyle,centerStyle,crownStyle,
      nameText:p.rankName||'',nameStyle,
      showIndex:p.showIndex!==false,
      idxText:p.idx!=null?String(p.idx):String(num),idxNumStyle,idxEmblemStyle,idxTLStyle,idxBRStyle};
  }
}
</script>
</body>
</html>
