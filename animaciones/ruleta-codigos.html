<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Papelito — Afirmaciones</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><script src="./card-emblems.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-family:'Hanken Grotesk',sans-serif;color:#f3ecdc;background:radial-gradient(120% 90% at 50% 0%,#1d1442 0%,#120b30 55%,#0b0726 100%)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;color:#f3ecdc}
.sub{font-size:12.5px;color:rgba(205,189,242,.7)}
.btn{height:48px;padding:0 28px;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#f0d488,#ecc874 55%,#d9ab55);color:#1c1338;font-weight:700;font-size:14px;font-family:inherit;box-shadow:0 10px 26px rgba(236,200,116,.28)}
.ghost{background:transparent;color:#e7cf9b;border:1px solid rgba(231,207,155,.4);box-shadow:none;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@keyframes afDropIn{from{opacity:0;transform:translateY(-46px) rotateZ(3deg)}to{opacity:1;transform:translateY(0) rotateZ(0deg)}}
.scene{min-height:420px;display:flex;align-items:center;justify-content:center;perspective:1100px}
.drop{animation:afDropIn .7s cubic-bezier(.2,.8,.3,1) both;transform-style:preserve-3d}
.paper{position:relative;width:296px;transform:rotate(-1.4deg);transform-style:preserve-3d;background:#f6eedb;background-image:repeating-linear-gradient(0deg, rgba(120,90,40,.06) 0 1px, transparent 1px 9px);box-shadow:0 26px 54px rgba(0,0,0,.55)}
.flap{position:absolute;left:0;right:0;height:64%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.35,.1,.25,1)}
.flap-top{bottom:100%;z-index:2;transform-origin:50% 100%;transform:rotateX(-178deg)}
.flap-bottom{top:100%;z-index:1;transform-origin:50% 0%;transform:rotateX(178deg)}
.open .flap-top,.open2 .flap-bottom{transform:rotateX(0deg)}
.face-back,.face-front{position:absolute;inset:0;backface-visibility:hidden;background-image:repeating-linear-gradient(0deg, rgba(120,90,40,.07) 0 1px, transparent 1px 9px)}
.face-back{transform:rotateX(180deg);background-color:#eadec2}
.flap-top .face-back{box-shadow:inset 0 -10px 18px -12px rgba(90,65,25,.5)}
.flap-bottom .face-back{box-shadow:inset 0 10px 18px -12px rgba(90,65,25,.5)}
.face-front{background-color:#f6eedb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.flap-top .face-front{border-bottom:1px solid rgba(120,90,40,.22)}
.flap-bottom .face-front{border-top:1px solid rgba(120,90,40,.22)}
.tag{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#8a6b3a}
.rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,#b98a3e,transparent)}
.body{position:relative;display:flex;align-items:center;justify-content:center;padding:26px;min-height:172px}
.ink{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:22px;line-height:1.45;color:#2b2050;text-align:center;text-wrap:pretty;opacity:0;filter:blur(5px);transition:opacity .9s ease, filter .9s ease}
.ink.show{opacity:1;filter:blur(0)}
</style></head><body>
<h1>Tu frase de la semana</h1>
<div class="scene"><div class="drop" id="drop">
<div class="paper" id="paper">
  <div class="flap flap-top"><div class="face-back"></div><div class="face-front"><div class="tag">Afirmación de Amor</div></div></div>
  <div class="body"><div class="ink" id="ink">“Merezco un amor que me elija todos los días.”</div></div>
  <div class="flap flap-bottom"><div class="face-back"></div><div class="face-front"><div class="rule"></div><div class="tag">Prisma Azul</div></div></div>
</div></div></div>
<div class="row"><button class="btn ghost" onclick="play()">Repetir</button></div>
<script>
var paper = document.getElementById('paper'), drop = document.getElementById('drop'), ink = document.getElementById('ink');
function play() {
  paper.classList.remove('open','open2'); ink.classList.remove('show');
  drop.style.animation = 'none'; void drop.offsetWidth; drop.style.animation = '';
  setTimeout(function(){ paper.classList.add('open'); }, 550);
  setTimeout(function(){ paper.classList.add('open2'); }, 1250);
  setTimeout(function(){ ink.classList.add('show'); }, 1900);
}
play();
</script></body></html>
