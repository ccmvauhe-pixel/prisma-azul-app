<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Oráculo — Selección de cartas</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><script src="./card-emblems.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-family:'Hanken Grotesk',sans-serif;color:#f3ecdc;background:radial-gradient(120% 90% at 50% 0%,#1d1442 0%,#120b30 55%,#0b0726 100%)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;color:#f3ecdc}
.sub{font-size:12.5px;color:rgba(205,189,242,.7)}
.btn{height:48px;padding:0 28px;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#f0d488,#ecc874 55%,#d9ab55);color:#1c1338;font-weight:700;font-size:14px;font-family:inherit;box-shadow:0 10px 26px rgba(236,200,116,.28)}
.ghost{background:transparent;color:#e7cf9b;border:1px solid rgba(231,207,155,.4);box-shadow:none;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pz-card-inner{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#2a1f57,#150d34 60%,#0b0726);box-shadow:0 12px 26px rgba(0,0,0,.5)}
.pz-lattice{position:absolute;inset:0;opacity:.6;background-image:repeating-linear-gradient(45deg, rgba(231,207,155,.10) 0 2px, transparent 2px 9px), repeating-linear-gradient(-45deg, rgba(205,189,242,.08) 0 2px, transparent 2px 9px)}
.pz-frame{position:absolute;inset:6px;border:1.5px solid rgba(231,207,155,.8);border-radius:7px}
.pz-emblem{position:absolute;left:24%;top:24%;width:52%;height:52%;background-size:contain;background-repeat:no-repeat;background-position:center}
.fan{position:relative;width:360px;max-width:92vw;height:250px;perspective:750px}
.fan-card{position:absolute;left:50%;bottom:0;width:74px;aspect-ratio:5/7;transform-origin:50% 118%;border-radius:8px;overflow:hidden;cursor:pointer;background:linear-gradient(160deg,#2a1f57,#150d34 60%,#0b0726);transition:transform .55s cubic-bezier(.25,.8,.25,1.05), border .2s, box-shadow .3s}
.fan-card .pz-frame{inset:5px;border-width:1.5px;border-radius:6px}
.fan-card .pz-emblem{left:28%;top:32%;width:44%;height:44%}
.count{font-size:13px;color:rgba(205,189,242,.7)}
</style></head><body>
<h1>Elige 3 cartas</h1>
<div class="sub">Las elegidas salen hacia adelante y la baraja se reduce</div>
<div class="fan" id="fan"></div>
<div class="count" id="count">Toca las cartas que te llamen.</div>
<div class="row"><button class="btn ghost" onclick="reset()">Reiniciar</button></div>
<script>
var N = 12, picked = [], fan = document.getElementById('fan'), els = [];
for (var i = 0; i < N; i++) {
  (function(i){
    var c = document.createElement('div');
    c.className = 'fan-card';
    c.innerHTML = '<div class="pz-lattice"></div><div class="pz-frame"></div><div class="pz-emblem" style="background-image:url(&quot;' + CARD_OSCURA['copas'] + '&quot;)"></div>';
    c.onclick = function(){
      var at = picked.indexOf(i);
      if (at >= 0) picked.splice(at,1); else if (picked.length < 3) picked.push(i);
      layout();
    };
    fan.appendChild(c); els.push(c);
  })(i);
}
function layout() {
  var rem = [];
  for (var k = 0; k < N; k++) if (picked.indexOf(k) < 0) rem.push(k);
  els.forEach(function(c, i){
    var sel = picked.indexOf(i) >= 0;
    if (sel) {
      var order = picked.indexOf(i);
      c.style.transform = 'translateX(calc(-50% + ' + ((order-1)*88) + 'px)) translateY(-152px) translateZ(80px) rotate(0deg) scale(1.12)';
      c.style.border = '1px solid rgba(231,207,155,.95)';
      c.style.boxShadow = '0 0 30px rgba(236,200,116,.65), 0 18px 34px rgba(0,0,0,.55)';
      c.style.zIndex = 40 + order;
    } else {
      var pos = rem.indexOf(i);
      var ang = rem.length > 1 ? -46 + pos*(92/(rem.length-1)) : 0;
      c.style.transform = 'translateX(-50%) rotate(' + ang.toFixed(1) + 'deg)';
      c.style.border = '1px solid rgba(231,207,155,.45)';
      c.style.boxShadow = '0 6px 16px rgba(0,0,0,.45)';
      c.style.zIndex = pos;
    }
  });
  document.getElementById('count').textContent = picked.length ? (picked.length + ' de 3 elegidas') : 'Toca las cartas que te llamen.';
}
function reset(){ picked = []; layout(); }
layout();
</script></body></html>
